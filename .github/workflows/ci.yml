name: CI

on:
  push:
    branches: [ master, main, "claude/*" ]
  pull_request:
    branches: [ master, main ]

# Bricht einen laufenden Run ab, wenn auf denselben Branch/PR neu gepusht wird.
# Spart Runner-Minuten bei schnellen Folge-Pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows+beta entfernt (seltenste Bug-Kombination).
        # Zum Zurückholen einfach { os: windows-latest, rust: beta } ergänzen.
        include:
          - { os: ubuntu-latest,  rust: stable }
          - { os: ubuntu-latest,  rust: beta }
          - { os: windows-latest, rust: stable }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # Stabiler, branch-unabhängiger Key -> Feature-Branches finden
          # den Cache vom main-Branch wieder.
          shared-key: test-${{ matrix.os }}

      - name: Tests
        working-directory: ./rust
        run: cargo test --all-features --verbose

      - name: Doc-Tests
        working-directory: ./rust
        run: cargo test --doc --all-features --verbose

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Kein Cache nötig: fmt kompiliert nicht, es parst nur.
      - name: Formatierung prüfen
        working-directory: ./rust
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: clippy
      - name: Clippy
        working-directory: ./rust
        run: cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: coverage
      # Vorkompiliertes Binary herunterladen statt 'cargo install'
      # (das tarpaulin sonst aus dem Quellcode baut -> mehrere Minuten).
      - uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-tarpaulin
      - name: Coverage erzeugen
        working-directory: ./rust
        run: cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out xml
      - uses: codecov/codecov-action@v7
        with:
          files: ./rust/cobertura.xml
          fail_ci_if_error: false

  build:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: release-${{ matrix.os }}
      # 'cargo test --release' baut alles im Release-Profil UND testet.
      # Das separate 'cargo build --release' war dadurch redundant.
      - name: Release-Build + Tests
        working-directory: ./rust
        run: cargo test --release --verbose

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: bench
      - name: Benchmarks
        working-directory: ./rust
        run: cargo bench --all-features 2>&1 | tee benchmark-output.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            rust/target/criterion/
            rust/benchmark-output.txt
          retention-days: 30
