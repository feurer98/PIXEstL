[package]
name = "pixestl-server"
version = "0.1.0"
edition = "2021"
description = "Async HTTP wrapper around the pixestl CLI for the web frontend"
license = "MIT"
publish = false

[[bin]]
name = "pixestl-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
